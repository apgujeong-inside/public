name: 실거래 자동 갱신

on:
  schedule:
    # 매일 한국시간 09:10~20:10, 매시 10분 (UTC 기준 00:10~11:10)
    - cron: "10 0-11 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "2006년부터 전체 수집 (최초 1회만)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-trades
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 데이터 수집
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python fetch_trades.py --backfill
          else
            python fetch_trades.py
          fi
      - name: 변경 시 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git add pyeong_table.csv 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "실거래 데이터 갱신" && git pull --rebase && git push)
